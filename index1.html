```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Navbar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: monospace;
            text-decoration: none;
        }

        body {
            background-color: aliceblue;
        }

        header {
            width: 100%;
            height: 60px;
            background-color: blue;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 10px 25px;
        }

        nav {
            display: flex;
            align-items: center;
        }

        nav a {
            color: white;
            padding: 15px 20px;
            font-size: 16px;
        }
    </style>     
</head>

<body>

    <!-- Navbar -->
    <header>
        <nav>
            <a href="#">HOME</a>
            <a href="#">ABOUT</a>
            <a href="#">CONTACT</a>                                                           
        </nav>
    </header>

</body>

</html>
```
